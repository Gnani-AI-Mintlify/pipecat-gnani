name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Install build tools
        run: uv sync --extra dev

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag=$TAG pkg=$PKG"
          test "$TAG" = "$PKG" || { echo "::error::Tag v$TAG does not match pyproject version $PKG"; exit 1; }

      - name: Build package
        run: uv run python -m build

      - name: Check distribution metadata
        run: uv run twine check dist/*

      - name: Smoke-test the built wheel
        run: |
          python3 -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          PKG="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          cd /tmp && /tmp/smoke/bin/python -c "
          import pipecat_gnani as p
          assert p.__version__ == '$PKG', (p.__version__, '$PKG')
          assert 'site-packages' in p.__file__
          print('ok', p.__version__)
          "

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only tagged releases publish; a manual run from a branch just builds and checks.
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/pipecat-gnani
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A tag push and a published GitHub Release both trigger this workflow;
          # the second run must not fail on files already uploaded.
          skip-existing: true
